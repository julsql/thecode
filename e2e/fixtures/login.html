<!doctype html>
<html lang="fr">
  <head><meta charset="utf-8" /><title>Page de connexion factice</title></head>
  <body>
    <!-- Formulaire minimal reproduisant ce que l'extension detecte dans la vraie
         vie : un champ identifiant suivi d'un champ mot de passe. -->
    <form>
      <label for="user">Identifiant</label>
      <input id="user" name="username" type="text" autocomplete="username" />

      <label for="pass">Mot de passe</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" />

      <button type="submit">Se connecter</button>
    </form>
  </body>
</html>
