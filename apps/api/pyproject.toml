[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thecode-api"
version = "0.1.0"
description = "Synchronisation chiffrée des carnets TheCode."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "stripe>=11.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "httpx>=0.28", "ruff>=0.16", "testcontainers[postgres]>=4.9"]

[tool.setuptools]
packages = ["thecode_api", "thecode_api.routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["."]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
ignore = [
    # Depends() en argument par defaut est LE pattern d'injection de FastAPI :
    # le signaler reviendrait a signaler le framework lui-meme.
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["thecode_api"]
