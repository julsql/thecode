[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thecode-api"
version = "0.1.0"
description = "Synchronisation chiffrée des carnets TheCode."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pydantic[email]>=2.14",
    "pydantic-settings>=2.16",
    "argon2-cffi>=25.1",
    "pyjwt[crypto]>=2.15",
    "stripe>=16.1",
]

[project.optional-dependencies]
test = ["pytest>=9.2", "pytest-cov>=7.1", "httpx2>=2.16", "ruff>=0.17", "testcontainers[postgres]>=4.15"]

[tool.setuptools]
packages = ["thecode_api", "thecode_api.routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["."]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
ignore = [
    # Depends() en argument par defaut est LE pattern d'injection de FastAPI :
    # le signaler reviendrait a signaler le framework lui-meme.
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["thecode_api"]
