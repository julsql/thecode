server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Google verification exact
    location = /google8031792c6641dc1d.html {
        try_files $uri =404;
    }

    # Fichiers SEO : servis tels quels, jamais le fallback SPA
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
