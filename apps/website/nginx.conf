server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx:alpine n'embarque pas le module brotli : gzip seulement.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Google verification exact
    location = /google8031792c6641dc1d.html {
        try_files $uri =404;
    }

    # Fichiers SEO : servis tels quels, jamais le fallback SPA
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        try_files $uri =404;
    }

    # Assets fingerprintés par Vite : cache long, immuable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA : page prérendue (<lang>/<page>/index.html) si elle existe, sinon
    # l'app. Le HTML est revalidé à chaque visite pour suivre les déploiements.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}
