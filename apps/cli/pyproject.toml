[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thecode"
version = "3.0.0"
description = "Génération déterministe de mots de passe à partir d'un site et d'une clef."
requires-python = ">=3.11"
authors = [{ name = "Jul SQL" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["pyperclip>=1.11", "cryptography>=50"]

[project.optional-dependencies]
test = ["pytest>=9.2", "pytest-cov>=7.1"]

[project.scripts]
thecode = "thecode.cli:main"

[tool.setuptools]
packages = ["thecode"]

# La PSL est livree avec le paquet : sans elle, canonical_site refuse de
# canonicaliser plutot que de produire un domaine divergent.
[tool.setuptools.package-data]
thecode = ["public_suffix_list.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Sans cela, le classement first-party/third-party de `thecode` depend du
# repertoire d'ou ruff est lance : le tri des imports differait entre le hook
# local (lance depuis la racine) et la CI (lancee depuis apps/cli).
src = ["."]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["thecode"]
