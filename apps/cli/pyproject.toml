[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thecode"
version = "2.0.0"
description = "Génération déterministe de mots de passe à partir d'un site et d'une clef."
requires-python = ">=3.9"
authors = [{ name = "Jul SQL" }]
license = { text = "MIT" }
dependencies = ["pyperclip>=1.8", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=5"]

[project.scripts]
thecode = "thecode.cli:main"

[tool.setuptools]
packages = ["thecode"]

# La PSL est livree avec le paquet : sans elle, canonical_site refuse de
# canonicaliser plutot que de produire un domaine divergent.
[tool.setuptools.package-data]
thecode = ["public_suffix_list.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Sans cela, le classement first-party/third-party de `thecode` depend du
# repertoire d'ou ruff est lance : le tri des imports differait entre le hook
# local (lance depuis la racine) et la CI (lancee depuis apps/cli).
src = ["."]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["thecode"]
