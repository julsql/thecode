<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <!-- Charges avant popup.js : ils exposent keyFingerprint et les
         helpers du carnet. -->
    <!-- defer : sans lui, ces scripts s'executeraient avant le corps du
         document et ne trouveraient aucun element. type="module" le faisait
         implicitement. -->
    <script defer src="fingerprint.js"></script>
    <script defer src="popup.js"></script>
    <title>TheCode - Clef</title>
  </head>

  <body>
    <h3>TheCode</h3>

    <!-- Clef -->
    <div>
      <label for="passphrase">Clef :</label>
      <input type="password" id="passphrase" />
      <button id="toggleKey" type="button" aria-pressed="false">Voir</button>
      <button id="setKey">Définir</button>
      <button id="clearKey">Effacer</button>
      <p id="status"></p>
      <!-- L'empreinte se memorise a force d'etre vue : une valeur differente
           signale une faute de frappe avant qu'elle ne coute un acces. -->
      <p id="fingerprintRow" class="fingerprint" hidden>
        Empreinte <span id="fingerprint" class="chip"></span>
      </p>
    </div>

    <hr />

    <!-- Paramètres avancés -->
    <div class="advanced-wrapper">
      <h3>Paramètres avancés</h3>
      <p class="hint">
        Ces réglages sont enregistrés et s'appliquent à tous les mots de passe générés, y compris
        depuis le menu affiché dans les pages.
      </p>
      <label>
        Longueur :
        <input type="number" id="length" min="4" max="40" step="1" value="20" />
      </label>
      <div class="checkbox-group">
        <label><input type="checkbox" id="lowercase" checked /> Minuscules</label>
        <label><input type="checkbox" id="uppercase" checked /> Majuscules</label>
        <label><input type="checkbox" id="numbers" checked /> Chiffres</label>
        <label><input type="checkbox" id="symbols" checked /> Symboles</label>
      </div>
    </div>

    <hr />

    <!-- Bouton de génération -->
    <button id="generatePassword">Générer mot de passe</button>

    <!-- Plusieurs comptes sur un meme site : il faut choisir, pas deviner.
         Un mauvais choix donne un mot de passe qui ne marche pas, sans
         rien expliquer. -->
    <p id="accountRow" hidden>
      <label for="accountSelect">Compte :</label>
      <select id="accountSelect"></select>
    </p>

    <p id="siteContainer">Site : <span id="site"></span></p>
    <p id="passwordResultContainer">
      Mot de passe : <span id="passwordResult"></span>
      <button id="copyPasswordBtn" title="Copier">
        <svg
          id="copyIcon"
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#e3e3e3"
        >
          <path
            d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z"
          />
        </svg>
      </button>
    </p>
    <p id="passwordSecurityContainer">Sécurité : <span id="passwordSecurity"></span></p>
    <p id="errorContainer">Erreur : <span id="error"></span></p>

    <hr />

    <!-- Le carnet retient les reglages par site : plus besoin de se
         souvenir qu'un compte avait ete cree sans symboles. -->
    <div class="vault">
      <button id="saveEntry" type="button">Enregistrer ce site</button>

      <!-- Renouveler et migrer : les deux actions qui changent un mot de passe
           deja en service. Jamais les deux a la fois — le compteur n'entre pas
           dans la derivation v1, et une entree v2 n'a plus rien a migrer. -->
      <button id="changeEntry" type="button" hidden>Renouveler</button>
      <p id="vaultStatus" class="hint"></p>

      <!-- Les deux cote a cote : le nouveau ne sert a rien tant qu'il n'a pas
           ete pose sur le site, et l'ancien reste celui qui connecte. -->
      <div id="changePreview" hidden>
        <p class="hint">Actuel</p>
        <p><code id="changeBefore"></code></p>
        <p class="hint">Nouveau</p>
        <p><code id="changeAfter"></code></p>
        <p class="hint">Changez-le sur le site, puis confirmez.</p>
        <button id="changeConfirm" type="button">Confirmer</button>
        <button id="changeCancel" type="button">Annuler</button>
      </div>

      <!-- Le transfert vit dans un onglet : un popup se ferme des qu'il perd
           le focus, et on perdrait le QR en allant le scanner. -->
      <button id="openTransfer" type="button">Transférer le carnet…</button>
    </div>

    <hr />

    <!-- Le carnet est chiffre avant de quitter le navigateur : le serveur
         ne recoit que des blocs opaques. -->
    <div id="syncSection" class="vault">
      <div id="syncLoggedOut">
        <input id="syncEmail" type="email" placeholder="Adresse e-mail" autocomplete="off" />
        <input
          id="syncPassword"
          type="password"
          placeholder="Mot de passe du compte"
          autocomplete="off"
        />
        <button id="syncLoginBtn" type="button">Connecter la synchronisation</button>
      </div>
      <div id="syncLoggedIn" hidden>
        <button id="syncNowBtn" type="button">Synchroniser</button>
        <button id="syncLogoutBtn" type="button">Déconnecter</button>
      </div>
      <p id="syncStatus" class="hint"></p>
    </div>
  </body>
</html>
