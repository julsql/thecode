plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.juliette.thecode'
    compileSdk 36

    defaultConfig {
        applicationId "fr.juliette.thecode"
        minSdk 21
        targetSdk 36
        versionCode 13
        versionName "2.3" // x-release-please-version

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        // Only ship English (default) and French resources. Devices in any
        // other locale fall back to values/ (English).
        resConfigs "en", "fr"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    // Chiffrement de la clef maitresse au repos, adosse au Keystore materiel.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.autofill:autofill:1.1.0'
    // QR code du carnet : generation et lecture. Contrairement au JavaScript,
    // ou l'encodeur est ecrit a la main faute de pouvoir embarquer quoi que ce
    // soit dans l'extension, un decodeur ne s'ecrit pas a la main.
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    // « Continuer avec Google » pour le compte de synchronisation : Credential
    // Manager rend un jeton d'identité que le service vérifie lui-même.
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    testImplementation 'junit:junit:4.13.2'
    // Lecture de shared/test-vectors.json dans les tests de conformite.
    // org.json est stubbe dans les tests unitaires Android, il faut la vraie lib.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
