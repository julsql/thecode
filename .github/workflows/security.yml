# Analyse de securite du depot.
#
# TheCode est un gestionnaire de mots de passe : une dependance compromise en
# amont ou un secret commis par megarde a des consequences directes pour les
# utilisateurs. Ces controles tournent donc sur chaque PR, plus une fois par
# semaine pour attraper les vulnerabilites publiees apres coup.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: secrets commis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, java-kotlin]
    steps:
      - uses: actions/checkout@v5
      # L'input s'appelle `languages` au pluriel. Avec `language`, il est
      # ignore en silence et l'auto-detection prend le dessus : elle trouve du
      # Swift (apps/apple) et echoue, Swift n'etant analysable que sur macOS.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/config.yml
      # autobuild cherche un projet a la racine et echoue : le Gradle vit dans
      # apps/android. On construit explicitement pour Java, et on laisse
      # autobuild faire pour les langages interpretes.
      - name: Build Java
        if: matrix.language == 'java-kotlin'
        run: ./gradlew :app:assembleDebug --console=plain
        working-directory: apps/android

      - uses: github/codeql-action/autobuild@v4
        if: matrix.language != 'java-kotlin'
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: dependances vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: npm audit (extension)
        working-directory: apps/extension/js-test
        run: npm audit --audit-level=high
      - name: npm audit (website)
        working-directory: apps/website
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: pip-audit (cli)
        working-directory: apps/cli
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off .

  image:
    name: image du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build sans push
        uses: docker/build-push-action@v6
        with:
          context: apps/website
          push: false
          load: true
          tags: thecode-website:scan
      # Image officielle plutot que l'action : celle-ci echouait au
      # telechargement de son binaire (cache introuvable), sans rapport avec le
      # contenu de l'image.
      #
      # Seulement les CVE : gitleaks couvre deja les secrets du depot.
      - name: trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:latest image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --scanners vuln \
              --exit-code 1 \
              thecode-website:scan
