# Garde-fou anti-divergence : verifie que toutes les implementations
# produisent les memes mots de passe que shared/test-vectors.json.
#
# Perimetre : la GENERATION (seed -> mot de passe). La normalisation de
# domaine n'est pas couverte ici ; la divergence connue entre Android
# (heuristique 2 labels) et l'extension (PSL) sera attrapee par
# shared/canonical-site-cases.json, ajoute au lot 1.
#
# Android tourne ici : le test unitaire Gradle est rapide (~1 s) et ne
# demande pas d'emulateur. Apple est couvert au moment de la release,
# le runner macOS etant facture 10x.

name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# github.workflow vaut le nom du workflow APPELANT : sans lui dans la cle, le
# run direct de conformance et celui appele par website.yml partagent le meme
# groupe et s'annulent mutuellement.
concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-integrity:
    name: integrite de shared/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Aucune copie de shared/ n'a diverge
        run: ./scripts/check-shared.sh

  javascript:
    name: extension (jest)
    runs-on: ubuntu-latest
    needs: shared-integrity
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/js-test/package-lock.json
      - run: npm ci
        working-directory: apps/extension/js-test
      - run: npx jest --ci
        working-directory: apps/extension/js-test

  python:
    name: cli (pytest)
    runs-on: ubuntu-latest
    needs: shared-integrity
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -e '.[test]'
        working-directory: apps/cli
      - run: python -m pytest -q
        working-directory: apps/cli

  website:
    name: website (vitest)
    runs-on: ubuntu-latest
    needs: shared-integrity
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
        working-directory: apps/website
      - run: npx vitest run
        working-directory: apps/website

  android:
    name: android (junit)
    runs-on: ubuntu-latest
    needs: shared-integrity
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Tests unitaires (pas d'emulateur, donc pas de surcout)
        run: ./gradlew :app:testDebugUnitTest --console=plain
        working-directory: apps/android
