# Extension navigateur : lint, tests, et paquet de release.
# Ne tourne que si l'extension ou un fichier partage a change.
name: extension

on:
  push:
    branches: [main]
    paths: ["apps/extension/**", "shared/**", ".github/workflows/extension.yml"]
  pull_request:
    paths: ["apps/extension/**", "shared/**", ".github/workflows/extension.yml"]
  workflow_dispatch:

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-shared.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/js-test/package-lock.json
      - run: npm ci
        working-directory: apps/extension/js-test
      - run: npx jest --ci --coverage
        working-directory: apps/extension/js-test

      # Les trois manifestes doivent rester coherents : c'est la source la plus
      # courante de refus en boutique, et rien ne les reliait jusqu'ici.
      - name: Manifestes valides et versions alignees
        working-directory: apps/extension
        run: |
          python3 - <<'PY'
          import json, sys
          files = ["manifest.json",
                   "manifest-chrome-brave-edge.json",
                   "manifest-safari-firefox.json"]
          versions = {}
          for f in files:
              with open(f) as fh:
                  m = json.load(fh)
              versions[f] = m["version"]
              assert m["manifest_version"] == 3, f"{f}: manifest_version attendu 3"
          if len(set(versions.values())) != 1:
              print("Versions desynchronisees :", versions)
              sys.exit(1)
          print("3 manifestes valides, version", next(iter(versions.values())))
          PY

      # web-ext est l'outil de Mozilla : on le lance sur la variante Firefox.
      # Le lancer sur le manifeste Chrome remonte BACKGROUND_SERVICE_WORKER_NOFALLBACK,
      # un defaut de compatibilite Firefox sans objet pour un manifeste Chrome.
      - name: web-ext lint (variante Firefox)
        working-directory: apps/extension
        run: |
          mkdir -p /tmp/ff && cp -r . /tmp/ff/ && rm -rf /tmp/ff/js-test
          cp /tmp/ff/manifest-safari-firefox.json /tmp/ff/manifest.json
          npx --yes web-ext lint --source-dir /tmp/ff --warnings-as-errors=false

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build the store archive
        working-directory: apps/extension
        run: |
          zip -r -q ../../thecode-extension.zip . \
            -x "js-test/*" ".idea/*" "Screenshots/*" "release/*" "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: thecode-extension.zip
          retention-days: 30
